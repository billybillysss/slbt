version: 1
layer: gold
domain: demo
tables:
  - name: gld_customer_order_ranking
    description: Top two orders per customer; the ranking boundary, tie-breaker and final limit must survive.
    output:
      sql: |
        WITH ranked AS (
          SELECT o.order_id, o.customer_id, o.amount,
            ROW_NUMBER() OVER (
              PARTITION BY o.customer_id ORDER BY o.amount DESC, o.order_id
            ) AS position
          FROM ref.gld_orders AS o
        )
        SELECT r.order_id, r.customer_id, r.amount, r.position
        FROM ranked AS r
        WHERE r.position <= 2
        ORDER BY r.customer_id NULLS LAST, r.position
        LIMIT 10
      columns:
        order_id:
          data_type: bigint
        customer_id:
          data_type: bigint
        amount:
          data_type: decimal(12, 2)
        position:
          data_type: bigint
